        - file: modules/03-clear-instructions/lab03.ipynb
        - file: modules/03-clear-instructions/practice.md
    - title: "Module 4: Structure, data, and templates"
      children:
        - file: modules/04-structure-data-and-templates/index.md
        - file: modules/04-structure-data-and-templates/lab04.ipynb
        - file: modules/04-structure-data-and-templates/practice.md
    - file: self-tests/self-test-1.md
    - title: "Module 5: Examples"
      children:
        - file: modules/05-examples/index.md
        - file: modules/05-examples/lab05.ipynb
        - file: modules/05-examples/practice.md
    - title: "Module 6: Reasoning and chains"
      children:
        - file: modules/06-reasoning-and-chains/index.md
        - file: modules/06-reasoning-and-chains/lab06.ipynb
        - file: modules/06-reasoning-and-chains/practice.md
    - title: "Module 7: Evaluating prompts"
      children:
        - file: modules/07-evaluating-prompts/index.md
        - file: modules/07-evaluating-prompts/lab07.ipynb
        - file: modules/07-evaluating-prompts/practice.md
    - title: "Module 8: Structured output and tools"
      children:
